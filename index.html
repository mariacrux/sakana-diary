<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fbff"><link rel="manifest" href="manifest.webmanifest"><title>さかな日記</title>
<style>
:root{--red:#d95d66;--blue:#477bd8;--ink:#26354a;--muted:#7c8ba0;--bg:#f5f8fc;--card:#fff;--accent:#73b9d4}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:720px;margin:auto;padding:18px 14px 100px}.hero{background:linear-gradient(135deg,#dff4fb,#f8fcff);border-radius:24px;padding:22px;box-shadow:0 8px 28px #9bb3c52b}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;color:var(--muted)}.progress{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.person,.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 18px #8293a51a}.count{font-size:28px;font-weight:800;margin-top:6px}.bar{height:10px;background:#e9eef4;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--accent);border-radius:20px}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 10px}.section h2{font-size:18px;margin:0}.week{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.day{min-width:76px;text-align:center;background:white;border-radius:16px;padding:11px 6px;box-shadow:0 4px 14px #8293a514}.day.today{outline:2px solid #9ad1e4}.date{font-weight:700}.fish{font-size:22px;min-height:28px}.entries{display:grid;gap:9px}.entry{background:#fff;border-radius:16px;padding:13px 14px;display:flex;justify-content:space-between;gap:10px}.meta{font-size:12px;margin-top:4px}.home{color:#333}.nursery{color:var(--red)}.therapy{color:var(--blue)}button{border:0;border-radius:14px;padding:12px 15px;font:inherit;font-weight:700}.primary{background:#75bfd9;color:white}.secondary{background:white;color:var(--ink);box-shadow:0 3px 12px #8293a51c}.actions{display:flex;gap:10px;margin-top:14px}.fab{position:fixed;right:20px;bottom:25px;width:62px;height:62px;border-radius:50%;font-size:28px;background:#75bfd9;color:#fff;box-shadow:0 8px 25px #508da866}.modal{display:none;position:fixed;inset:0;background:#22304255;align-items:flex-end;z-index:10}.sheet{background:#f8fafc;width:100%;max-width:720px;margin:auto;border-radius:24px 24px 0 0;padding:20px 16px 30px}.sheet h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}input,select{width:100%;font:inherit;padding:12px;border:1px solid #dbe3eb;border-radius:12px;background:white}.checks{display:flex;gap:16px}.checks label{color:var(--ink)}.legend{font-size:12px;color:var(--muted);margin:10px 4px}.empty{color:var(--muted);font-size:14px;padding:8px 2px}@media print{body{background:white}main{max-width:none}.fab,.actions{display:none}.hero,.person,.card,.entry,.day{box-shadow:none;border:1px solid #ddd}.week{overflow:visible}.day{min-width:0;flex:1}}
</style>  <link rel="apple-touch-icon" href="icon-192.png">
</head><body><main><section class="hero"><h1>🐟 さかな日記</h1><p id="weekLabel">今週の魚チャレンジ</p><div class="progress"><div class="person"><b>ふうた</b><div class="count" id="fCount">0 / 4</div><div class="bar"><div class="fill" id="fBar"></div></div></div><div class="person"><b>みちる</b><div class="count" id="mCount">0 / 4</div><div class="bar"><div class="fill" id="mBar"></div></div></div></div></section>
<div class="section"><h2>今週</h2><span>目標 週4回</span></div><div class="week" id="week"></div><div class="legend">● 自宅＝黒　<span class="nursery">● 保育園＝赤</span>　<span class="therapy">● 療育＝青</span></div>
<div class="section"><h2>記録</h2></div><div class="entries" id="entries"></div><div class="actions"><button class="secondary" onclick="changeWeek(-7)">← 前の週</button><button class="secondary" onclick="goToday()">今週</button><button class="secondary" onclick="changeWeek(7)">次の週 →</button><button class="primary" onclick="window.print()">PDF / 印刷</button></div></main><button class="fab" onclick="openModal()">＋</button>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2>魚を記録 🐟</h2><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>料理名</label><input id="meal" placeholder="例：鮭の塩焼き"></div><div class="grid"><div class="field"><label>場所</label><select id="place"><option value="home">自宅</option><option value="nursery">保育園</option><option value="therapy">療育</option></select></div><div class="field"><label>食べた子</label><div class="checks"><label><input id="futa" type="checkbox" checked> ふうた</label><label><input id="michi" type="checkbox" checked> みちる</label></div></div></div><div class="actions"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" onclick="save()">保存</button></div></div></div>
<script>
const KEY='sakanaDiary.v1'; let records=JSON.parse(localStorage.getItem(KEY)||'[]'); let anchor=new Date();
const fmt=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
function monday(d){let x=new Date(d);x.setHours(0,0,0,0);let day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
function render(){let start=monday(anchor), end=new Date(start);end.setDate(end.getDate()+6);document.getElementById('weekLabel').textContent=`${start.getMonth()+1}/${start.getDate()}〜${end.getMonth()+1}/${end.getDate()} の魚チャレンジ`;let wr=records.filter(r=>{let d=new Date(r.date+'T00:00:00');return d>=start&&d<=end});let fc=wr.filter(r=>r.kids.includes('futa')).length,mc=wr.filter(r=>r.kids.includes('michi')).length;fCount.textContent=`${fc} / 4${fc>=4?' 🎉':''}`;mCount.textContent=`${mc} / 4${mc>=4?' 🎉':''}`;fBar.style.width=Math.min(fc/4*100,100)+'%';mBar.style.width=Math.min(mc/4*100,100)+'%';week.innerHTML='';let names=['月','火','水','木','金','土','日'];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);let rs=wr.filter(r=>r.date===fmt(d));let div=document.createElement('div');div.className='day'+(fmt(d)===fmt(new Date())?' today':'');div.innerHTML=`<div>${names[i]}</div><div class="date">${d.getMonth()+1}/${d.getDate()}</div><div class="fish">${rs.length?'🐟'.repeat(Math.min(rs.length,3)):'・'}</div>`;week.appendChild(div)}entries.innerHTML='';wr.sort((a,b)=>a.date.localeCompare(b.date)).forEach((r,idx)=>{let div=document.createElement('div');div.className='entry';let p={home:'自宅',nursery:'保育園',therapy:'療育'}[r.place];let kids=r.kids.map(k=>k==='futa'?'ふうた':'みちる').join('・');div.innerHTML=`<div><b>${r.date.slice(5).replace('-','/')}　${r.meal}</b><div class="meta ${r.place}">${p} ｜ ${kids}</div></div><button class="secondary" onclick="del('${r.id}')">削除</button>`;entries.appendChild(div)});if(!wr.length)entries.innerHTML='<div class="empty">まだ記録がありません。右下の＋から追加できます。</div>'}
function openModal(){date.value=fmt(new Date());meal.value='';futa.checked=true;michi.checked=true;modal.style.display='flex'}function closeModal(){modal.style.display='none'}function save(){let kids=[];if(futa.checked)kids.push('futa');if(michi.checked)kids.push('michi');if(!date.value||!meal.value.trim()||!kids.length)return alert('日付・料理名・食べた子を入力してね');records.push({id:Date.now().toString(),date:date.value,meal:meal.value.trim(),place:place.value,kids});localStorage.setItem(KEY,JSON.stringify(records));anchor=new Date(date.value+'T12:00:00');closeModal();render()}function del(id){if(confirm('この記録を削除する？')){records=records.filter(r=>r.id!==id);localStorage.setItem(KEY,JSON.stringify(records));render()}}function changeWeek(n){anchor.setDate(anchor.getDate()+n);render()}function goToday(){anchor=new Date();render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
