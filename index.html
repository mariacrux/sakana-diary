<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fbff"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>さかな日記</title>
<style>
:root{--red:#d95d66;--blue:#477bd8;--ink:#26354a;--muted:#7c8ba0;--bg:#f5f8fc;--accent:#73b9d4}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:720px;margin:auto;padding:18px 14px 100px}.hero{background:linear-gradient(135deg,#dff4fb,#f8fcff);border-radius:24px;padding:22px;box-shadow:0 8px 28px #9bb3c52b}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;color:var(--muted)}.progress{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.person{background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 18px #8293a51a}.count{font-size:28px;font-weight:800;margin-top:6px}.bar{height:10px;background:#e9eef4;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--accent);border-radius:20px}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 10px}.section h2{font-size:18px;margin:0}.week{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.day{min-width:76px;text-align:center;background:white;border-radius:16px;padding:11px 6px;box-shadow:0 4px 14px #8293a514}.day.today{outline:2px solid #9ad1e4}.date{font-weight:700}.fish{font-size:22px;min-height:28px}.entries{display:grid;gap:9px}.entry{background:#fff;border-radius:16px;padding:13px 14px;display:flex;justify-content:space-between;gap:10px}.meta{font-size:12px;margin-top:4px}.home{color:#333}.nursery{color:var(--red)}.therapy{color:var(--blue)}button{border:0;border-radius:14px;padding:12px 15px;font:inherit;font-weight:700}.primary{background:#75bfd9;color:white}.secondary{background:white;color:var(--ink);box-shadow:0 3px 12px #8293a51c}.danger{color:#b94b55}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.fab{position:fixed;right:20px;bottom:25px;width:62px;height:62px;border-radius:50%;font-size:28px;background:#75bfd9;color:#fff;box-shadow:0 8px 25px #508da866}.modal,.gate{display:none;position:fixed;inset:0;background:#22304277;z-index:20}.modal{align-items:flex-end}.gate{align-items:center;padding:18px}.sheet{background:#f8fafc;width:100%;max-width:720px;margin:auto;border-radius:24px 24px 0 0;padding:20px 16px 30px}.gatebox{background:#fff;width:100%;max-width:430px;margin:auto;border-radius:24px;padding:24px}.sheet h2,.gatebox h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}input,select{width:100%;font:inherit;padding:12px;border:1px solid #dbe3eb;border-radius:12px;background:white}.checks{display:flex;gap:16px}.checks label{color:var(--ink)}.checks input{width:auto}.legend,.status{font-size:12px;color:var(--muted);margin:10px 4px}.empty{color:var(--muted);font-size:14px;padding:8px 2px}.notice{background:#fff8dc;border-radius:16px;padding:13px 14px;margin:14px 0;font-size:14px}.role{font-size:12px;color:var(--muted);float:right}.hidden{display:none!important}@media print{body{background:white}main{max-width:none}.fab,.actions,.notice{display:none}.hero,.person,.entry,.day{box-shadow:none;border:1px solid #ddd}.week{overflow:visible}.day{min-width:0;flex:1}}
</style></head><body>
<div class="gate" id="gate"><div class="gatebox"><h2>🐟 さかな日記</h2><p>家族の合言葉を入力してください。</p><div class="field"><label>合言葉</label><input id="passphrase" type="password"></div><button class="primary" id="enterBtn" style="width:100%">はいる</button><div class="status" id="gateStatus"></div></div></div>
<main id="app" class="hidden"><section class="hero"><span class="role" id="roleLabel"></span><h1>🐟 さかな日記</h1><p id="weekLabel">今週の魚チャレンジ</p><div class="progress"><div class="person"><b>ふうた</b><div class="count" id="fCount">0 / 4</div><div class="bar"><div class="fill" id="fBar"></div></div></div><div class="person"><b>みちる</b><div class="count" id="mCount">0 / 4</div><div class="bar"><div class="fill" id="mBar"></div></div></div></div></section>
<div id="migrationNotice" class="notice hidden">このiPhoneに以前の記録が残っています。クラウドへ移せます。古いデータは端末から消しません。<div class="actions"><button class="primary" onclick="migrateOldData()">旧データをクラウドへ移す</button></div></div>
<div class="section"><h2>今週</h2><span>目標 週4回</span></div><div class="week" id="week"></div><div class="legend">● 自宅＝黒　<span class="nursery">● 保育園＝赤</span>　<span class="therapy">● 療育＝青</span></div><div class="section"><h2>記録</h2></div><div class="entries" id="entries"></div><div class="actions"><button class="secondary" onclick="changeWeek(-7)">← 前の週</button><button class="secondary" onclick="goToday()">今週</button><button class="secondary" onclick="changeWeek(7)">次の週 →</button><button class="primary" onclick="window.print()">PDF / 印刷</button></div></main><button class="fab hidden" id="fab" onclick="openModal()">＋</button>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2>魚を記録 🐟</h2><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>料理名</label><input id="meal" placeholder="例：鮭の塩焼き"></div><div class="grid"><div class="field"><label>場所</label><select id="place"><option value="home">自宅</option><option value="nursery">保育園</option><option value="therapy">療育</option></select></div><div class="field"><label>食べた子</label><div class="checks"><label><input id="futa" type="checkbox" checked> ふうた</label><label><input id="michi" type="checkbox" checked> みちる</label></div></div></div><div class="actions"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" id="saveBtn" onclick="save()">保存</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://fimlymbwelyurmslnasm.supabase.co',SUPABASE_KEY='sb_publishable__RE-ZRAtpWlYrR2hdisLqQ_CBS-c9ui',OLD_KEY='sakanaDiary.v1',MIGRATION_KEY='sakanaDiary.cloudMigrated.v1';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let records=[],role=null,anchor=new Date();const $=id=>document.getElementById(id);const fmt=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};function monday(d){let x=new Date(d);x.setHours(0,0,0,0);let day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
async function boot(){try{let {data:{session}}=await sb.auth.getSession();if(!session){let {error}=await sb.auth.signInAnonymously();if(error)throw error}let {data:r,error}=await sb.rpc('my_family_role');if(error)throw error;if(!r){$('gate').style.display='flex';return}await enterApp(r)}catch(e){$('gate').style.display='flex';$('gateStatus').textContent='接続できませんでした。通信状態を確認してください。';console.error(e)}}
$('enterBtn').onclick=async()=>{let p=$('passphrase').value;if(!p)return;$('enterBtn').disabled=true;$('gateStatus').textContent='確認中…';try{let {data,error}=await sb.rpc('claim_family_access',{passphrase:p});if(error)throw error;if(data==='invalid'){$('gateStatus').textContent='合言葉が違います。';return}$('passphrase').value='';await enterApp(data)}catch(e){$('gateStatus').textContent='認証できませんでした。';console.error(e)}finally{$('enterBtn').disabled=false}};
async function enterApp(r){role=r;$('gate').style.display='none';$('app').classList.remove('hidden');$('roleLabel').textContent=role==='editor'?'編集モード':'閲覧モード';if(role==='editor')$('fab').classList.remove('hidden');await loadRecords();let old=JSON.parse(localStorage.getItem(OLD_KEY)||'[]');if(role==='editor'&&old.length&&!localStorage.getItem(MIGRATION_KEY))$('migrationNotice').classList.remove('hidden')}
async function loadRecords(){let {data,error}=await sb.from('fish_records').select('id,entry_id,eaten_date,meal_name,place,child').order('eaten_date',{ascending:true}).order('id',{ascending:true});if(error){alert('記録を読み込めませんでした');console.error(error);return}let map=new Map();for(let row of data||[]){let key=row.entry_id;if(!map.has(key))map.set(key,{entry_id:key,date:row.eaten_date,meal:row.meal_name,place:row.place,kids:[]});map.get(key).kids.push(row.child)}records=[...map.values()];render()}
function render(){let start=monday(anchor),end=new Date(start);end.setDate(end.getDate()+6);$('weekLabel').textContent=`${start.getMonth()+1}/${start.getDate()}〜${end.getMonth()+1}/${end.getDate()} の魚チャレンジ`;let wr=records.filter(r=>{let d=new Date(r.date+'T00:00:00');return d>=start&&d<=end});let fc=wr.filter(r=>r.kids.includes('futa')).length,mc=wr.filter(r=>r.kids.includes('michi')).length;$('fCount').textContent=`${fc} / 4${fc>=4?' 🎉':''}`;$('mCount').textContent=`${mc} / 4${mc>=4?' 🎉':''}`;$('fBar').style.width=Math.min(fc/4*100,100)+'%';$('mBar').style.width=Math.min(mc/4*100,100)+'%';$('week').innerHTML='';let names=['月','火','水','木','金','土','日'];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);let rs=wr.filter(r=>r.date===fmt(d));let div=document.createElement('div');div.className='day'+(fmt(d)===fmt(new Date())?' today':'');div.innerHTML=`<div>${names[i]}</div><div class="date">${d.getMonth()+1}/${d.getDate()}</div><div class="fish">${rs.length?'🐟'.repeat(Math.min(rs.length,3)):'・'}</div>`;$('week').appendChild(div)}$('entries').innerHTML='';wr.sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{let div=document.createElement('div');div.className='entry';let p={home:'自宅',nursery:'保育園',therapy:'療育'}[r.place],kids=r.kids.map(k=>k==='futa'?'ふうた':'みちる').join('・'),db=role==='editor'?`<button class="secondary danger" onclick="delEntry('${r.entry_id}')">削除</button>`:'';div.innerHTML=`<div><b>${r.date.slice(5).replace('-','/')}　${esc(r.meal)}</b><div class="meta ${r.place}">${p} ｜ ${kids}</div></div>${db}`;$('entries').appendChild(div)});if(!wr.length)$('entries').innerHTML='<div class="empty">まだ記録がありません。</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function openModal(){if(role!=='editor')return;$('date').value=fmt(new Date());$('meal').value='';$('futa').checked=true;$('michi').checked=true;$('modal').style.display='flex'}function closeModal(){$('modal').style.display='none'}
async function save(){let kids=[];if($('futa').checked)kids.push('futa');if($('michi').checked)kids.push('michi');if(!$('date').value||!$('meal').value.trim()||!kids.length)return alert('日付・料理名・食べた子を入力してね');let eid=crypto.randomUUID(),rows=kids.map(child=>({entry_id:eid,eaten_date:$('date').value,meal_name:$('meal').value.trim(),place:$('place').value,child}));let {error}=await sb.from('fish_records').insert(rows);if(error)return alert('保存できませんでした');anchor=new Date($('date').value+'T12:00:00');closeModal();await loadRecords()}
async function delEntry(id){if(role!=='editor'||!confirm('この記録を削除する？'))return;let {error}=await sb.from('fish_records').delete().eq('entry_id',id);if(error)return alert('削除できませんでした');await loadRecords()}function changeWeek(n){anchor.setDate(anchor.getDate()+n);render()}function goToday(){anchor=new Date();render()}
async function migrateOldData(){let old=JSON.parse(localStorage.getItem(OLD_KEY)||'[]');if(!old.length)return;if(!confirm(`${old.length}件の旧記録をクラウドへ移します。よろしいですか？`))return;let rows=[];for(let r of old){let eid=crypto.randomUUID();for(let child of r.kids||[])rows.push({entry_id:eid,eaten_date:r.date,meal_name:r.meal,place:r.place,child})}let {error}=await sb.from('fish_records').insert(rows);if(error)return alert('移行できませんでした。旧データは残っています。');localStorage.setItem(MIGRATION_KEY,new Date().toISOString());$('migrationNotice').classList.add('hidden');alert('旧データをクラウドへ移しました。');await loadRecords()}
boot();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
